# Baseline, not a refined result. Requires the matching prepared gradient body.
# See docs/modern_grouped_gui.md; never substitute conventional data.
title: FCC Al grouped gradient baseline
microscope:
  energy_kv: 200.0
  zone_axis:
  - 0
  - 0
  - 1
sample: null
scan:
  scan_columns: 38
  scan_rows: 38
  corner_a:
  - -0.50623966320854
  - 0.4005412719891745
  corner_b:
  - 0.39497819876710266
  - 0.5006765899864682
  corner_c:
  - -0.39497819876710266
  - -0.5006765899864682
experiment:
  path: ../tmp/b7e_gradient_depth_b_refinement/gradient_body.dat
  gradient_option: 1
  header: absent
  format: legacy_intensity_blocks
refinement:
  optimizer:
    method: ANSI
    loops: 1
    maxfsimp: 59
    maxfpara: 3
    ftol: 1.0e-06
    chimin: 1.0e-06
    maxtemp: 0.05
    mintemp: 0.0001
    coolrate: 0.9
    seed: 2026
    paraopt: 1
    loud: 1
  parameters:
  - target:
      category: debye_waller
      identifiers:
      - site_group
      - Al_fcc
    range_factors:
    - 1.05
    - 0.95
    plamda: 0.0002
  - target:
      category: depth
      identifiers:
      - sample
      - requested_depth
    range_factors:
    - 1.05
    - 0.95
    plamda: 0.5
  iref: -1.0
  objective_mode: masked
  invalid_trial_policy: reject
  active_categories: null
  bounds:
    policy: reject
    specific:
    - target:
        category: debye_waller
        identifiers:
        - site_group
        - Al_fcc
      lower: 0.5
      upper: 1.5
    - target:
        category: depth
        identifiers:
        - sample
        - requested_depth
      lower: 600.0
      upper: 1200.0
    absolute: []
    relative: []
execution:
  execution_backend: batched
  batch_size: 64
run:
  output_directory: ../tmp/modern_grouped_gui_run
  output_filename: ../tmp/modern_grouped_gui_run/final_out.dat
  snapshot_every: 25
  checkpoint_every: 25
  max_total_evaluations: 150
  max_wall_time_seconds: 1800.0
legacy_export:
  dsmax_inverse_angstrom: null
  filename: null
  title_raw: null
  output_filename_raw: null
  experimental_filename_raw: null
schema_version: 1
crystallography:
  structure:
    path: fcc_al_conventional.extxyz
    format: extxyz
  zone_axis:
  - 0
  - 0
  - 1
  cbed_basis:
    g1_hkl:
    - 2
    - 0
    - 0
    g2_hkl:
    - 0
    - 2
    - 0
  mesh:
    mesh_x: 16
    mesh_y: 16
  depth_angstrom: 840.0
  slice_boundaries_fractional:
  - 0.0
  - 0.5
  - 1.0
  debye_waller: []
  dsap_inverse_angstrom: 2.5
  beams:
  - id: lattice_0_0
    lattice_coordinates:
    - 0
    - 0
  - id: lattice_-1_0
    lattice_coordinates:
    - -1
    - 0
  - id: lattice_1_0
    lattice_coordinates:
    - 1
    - 0
  - id: lattice_0_-1
    lattice_coordinates:
    - 0
    - -1
  - id: lattice_0_1
    lattice_coordinates:
    - 0
    - 1
  - id: lattice_-1_-1
    lattice_coordinates:
    - -1
    - -1
  - id: lattice_1_1
    lattice_coordinates:
    - 1
    - 1
  - id: lattice_-1_1
    lattice_coordinates:
    - -1
    - 1
  - id: lattice_1_-1
    lattice_coordinates:
    - 1
    - -1
  scan_basis_transform:
  - - 1
    - 0
  - - 0
    - -1
  absorption:
    enabled: false
    coefficients: []
    legacy_raw: null
  site_groups:
  - id: Al_fcc
    element: Al
    site_indices:
    - 0
    - 1
    - 2
    - 3
    debye_waller_b: 0.86
    occupancy: 1.0
    absorption:
    - 0.0
    - 1.0
    - 1.0
