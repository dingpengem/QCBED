[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qcbed"
version = "0.1.0"
description = "Python rewrite foundation for legacy QCBED multislice simulations"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
package = [
    "PyInstaller==6.22.3",
    "PySide6>=6.6,<7",
    "PyYAML>=6",
    "scipy>=1.10",
    "h5py>=3.8",
    "matplotlib>=3.6",
    "psutil>=5.9",
]
gui = ["PySide6>=6.6,<7", "PyYAML>=6", "matplotlib>=3.6"]
yaml = ["PyYAML>=6"]
visualization = [
    "matplotlib>=3.6",
]
test = [
    "pytest>=7",
    "PyYAML>=6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
